name: Stargazers Tracker

on:
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-stargazer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Stargazers in README
        run: |
          ACTOR="${{ github.event.sender.login }}"
          URL="${{ github.event.sender.html_url }}"
          DATE="$(date +'%Y-%m-%d')"

          echo "🌟 New Star by: ${ACTOR} (${URL})"

          if [ -n "${ACTOR}" ] && ! grep -q "@${ACTOR}" README.md; then
            echo "| <img src=\"https://avatars.githubusercontent.com/${ACTOR}?s=40\" width=\"40\" height=\"40\" style=\"border-radius:50%\"/> | **${ACTOR}** | [@${ACTOR}](${URL}) | ${DATE} |" >> README.md
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: record new stargazer @${ACTOR}"
            git push origin main
            echo "✅ README updated with new stargazer @${ACTOR}"
          else
            echo "ℹ️ User already recorded or actor empty"
          fi
