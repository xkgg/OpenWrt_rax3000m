# CI项目名
name: REDMI-AX6000

on:
  # 自动编译：每天早上4点 (UTC 20:00)
  schedule:
    - cron: '0 20 * * *'
  # 手动编译
  workflow_dispatch:

# CI权限
permissions: write-all

concurrency:
  group: redmiax6000-${{ github.ref }}
  cancel-in-progress: false

env:
  OWRT_TARGET: redmiax6000
  OWRT_THEME: argon
  OWRT_NAME: redmi-ax6000
  OWRT_wifi_ssid: Redmi_5A21
  OWRT_PW: password
  OWRT_IP: 192.168.31.1
  OWRT_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: openwrt-24.10-6.6

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v7.0.1

      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sed -i 's/\r$//' "$GITHUB_WORKSPACE/Scripts/cleanup_env.sh"
          bash "$GITHUB_WORKSPACE/Scripts/cleanup_env.sh"
          sudo apt-get update -qq
          # 兼容 Ubuntu 24.04 包名映射
          mapfile -t dependencies < <(
            sed -n '3{s/\r$//;p;}' Depends.txt | tr ' ' '\n' |
              sed -e '/^$/d' \
                  -e 's/^libncurses5-dev$/libncurses-dev/' \
                  -e 's/^libncursesw5$/libncurses-dev/' \
                  -e 's/^libncursesw5-dev$/libncurses-dev/' \
                  -e 's/^gnutls-dev$/libgnutls28-dev/' \
                  -e 's/^libz-dev$/zlib1g-dev/' \
                  -e 's/^mkisofs$/genisoimage/' |
              sort -u
          )
          test "${#dependencies[@]}" -gt 0
          sudo apt-get install -y --no-install-recommends "${dependencies[@]}" \
            clang lld llvm zstd file xz-utils python3-setuptools
          sudo apt-get clean
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          df -h

      - name: 初始化值
        run: |
          source_name="${OWRT_URL##*/}"
          source_name="${source_name%.git}"
          export OWRT_SOURCE="$source_name"
          export OWRT_DATE=$(TZ="Asia/Shanghai" date +"%Y.%m.%d_%H.%M.%S")
          if [[ -f "$GITHUB_WORKSPACE/Config/$OWRT_TARGET.txt" ]]; then
            export OWRT_TYPE=$(sed -n "1{s/^#//;s/\r$//;p;q}" "$GITHUB_WORKSPACE/Config/$OWRT_TARGET.txt")
          else
            export OWRT_TYPE=$(sed -n "1{s/^#//;s/\r$//;p;q}" "$GITHUB_WORKSPACE/Config/redmiax6000.txt")
          fi

          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_TARGET=$OWRT_TARGET" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_TYPE=$OWRT_TYPE" >> $GITHUB_ENV
          echo "OWRT_PW=$OWRT_PW" >> $GITHUB_ENV
          echo "OWRT_IP=$OWRT_IP" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          cd ./Scripts
          dos2unix ./*.sh
          chmod +x ./*.sh

      - name: Clone OWRT Code
        run: |
          git clone --depth 1 -b "$REPO_BRANCH" "$OWRT_URL" ./owrt

      - name: Load custom feeds
        run: |
          cd ./owrt
          echo 'src-git smpackage https://github.com/kenzok8/small-package' >> feeds.conf.default

      - name: Update Feeds
        run: |
          cd ./owrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Scripts
        run: |
          cd ./owrt
          $GITHUB_WORKSPACE/Scripts/Settings.sh
          cd ./package
          $GITHUB_WORKSPACE/Scripts/Plugins.sh

      - name: Custom Settings
        run: |
          cd ./owrt
          rm -rf ./tmp* ./.config*
          if [[ -f "$GITHUB_WORKSPACE/Config/$OWRT_TARGET.txt" ]]; then
            cat "$GITHUB_WORKSPACE/Config/$OWRT_TARGET.txt" >> .config
          fi
          if [[ -f "$GITHUB_WORKSPACE/Config/redmiax6000.txt" && "$OWRT_TARGET" != "redmiax6000" ]]; then
            cat "$GITHUB_WORKSPACE/Config/redmiax6000.txt" >> .config
          fi
          $GITHUB_WORKSPACE/Scripts/Extras.sh
          make defconfig

      - name: Cleanup Toolchain
        run: |
          cd ./owrt
          make dirclean

      - name: Download Packages
        run: |
          cd ./owrt
          make download -j$(($(nproc)+1))

      - name: Compile Firmware
        run: |
          cd ./owrt
          make -j $(($(nproc)+1)) || make -j$(nproc) V=s || make -j1 V=s
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./owrt && mkdir -p ./upload
          while IFS= read -r -d '' file; do
            dest="./upload/$(basename "$file")"
            cp "$file" "$dest"
          done < <(find bin/targets -type d -name packages -prune -o -type f -print0)
          cp -f ./.config ./upload/Config_"$OWRT_TARGET"_"$OWRT_SOURCE"_"$OWRT_DATE".txt
          cd ./upload
          $GITHUB_WORKSPACE/Scripts/Renames.sh

      - name: Release Firmware
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{env.OWRT_TARGET}}_${{env.OWRT_SOURCE}}_${{env.OWRT_DATE}}
          name: REDMI-AX6000 ${{ env.OWRT_DATE }}
          files: ./owrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，更就完事了！

            源码：${{env.OWRT_SOURCE}}
            分支：${{env.REPO_BRANCH}}
            平台：${{env.OWRT_TARGET}}
            设备：${{env.OWRT_TYPE}}
            密码：${{env.OWRT_PW}}
            地址：${{env.OWRT_IP}}

      - name: Delete Old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          keep_latest: 3
          delete_tags: true

      - name: Delete Old Workflows
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 3
          keep_minimum_runs: 1
